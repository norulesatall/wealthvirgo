name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript types
        run: npm run lint

      - name: Build production application
        run: npm run build
        env:
          NODE_ENV: production

      # Deploy to Cloudflare Pages via Wrangler
      # Verifies secrets, auto-creates the project if needed, and deploys with full logging
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is missing or empty!"
            echo "Please configure it in GitHub: Settings -> Secrets and variables -> Actions -> Repository secrets -> CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing or empty!"
            echo "Please configure it in GitHub: Settings -> Secrets and variables -> Actions -> Repository secrets -> CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          PROJECT_NAME="${{ vars.CLOUDFLARE_PROJECT_NAME || secrets.CLOUDFLARE_PROJECT_NAME || 'wealthvirgo' }}"

          echo "Ensuring Cloudflare Pages project '$PROJECT_NAME' exists..."
          npx -y wrangler pages project create "$PROJECT_NAME" --production-branch=main 2>&1 || true

          echo "Deploying dist directory to Cloudflare Pages..."
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          if [ "$BRANCH_NAME" = "main" ]; then
            npx -y wrangler pages deploy dist --project-name="$PROJECT_NAME" --commit-dirty=true
          else
            npx -y wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch="$BRANCH_NAME" --commit-dirty=true
          fi
